name: Keep mock server warm

on:
  schedule:
    # Every 14 minutes — just under Render's 15-minute idle threshold.
    # GitHub Actions cron can drift by 1–2 minutes, so 14 is safer than 14:59.
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          SERVER_URL: ${{ vars.RENDER_SERVER_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "RENDER_SERVER_URL repository variable is not set."
            exit 1
          fi
          status=$(curl -sS -o /tmp/body -w "%{http_code}" "$SERVER_URL/health")
          echo "HTTP $status"
          cat /tmp/body || true
          test "$status" -ge 200 -a "$status" -lt 300
